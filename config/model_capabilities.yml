# Domain routing — the heart of why this orchestrator exists.
#
# For each coding domain, the planner is told the PREFERRED TIER and the
# current best-in-tier shortlist. The planner should pick by tier FIRST;
# preferred_models is the current concrete shortlist as of corpus_metadata.
# last_reviewed. If a newer flagship is added to models below, the planner
# may pick it even if it's not in preferred_models.
domain_routing:
  frontend:
    preferred_tier: flagship
    preferred_models: [claude-opus-5-5, gemini-3.8-flash, gpt-6-sol]
    cheap_fallback: [claude-sonnet-5, gpt-6-luna]
    why: "React/Vue/CSS need design judgment + accessibility awareness + state-mgmt depth. Pick any flagship-tier coder; drop to workhorse only when the work is mechanical."

  backend:
    preferred_tier: flagship
    preferred_models: [claude-opus-5-5, gpt-6-sol, gemini-3.8-flash]
    cheap_fallback: [claude-sonnet-5, gpt-6-luna]
    why: "API design, business logic, error-handling design — flagship-tier coders make better trade-offs. Drop to workhorse only for CRUD scaffolding."

  security:
    preferred_tier: reasoning
    preferred_models: [gpt-6-astra, claude-fable-5-1, gemini-3.1-pro-preview, claude-opus-5-5]
    cheap_fallback: []  # NO cheap fallback — security is false economy
    why: "Auth, crypto, input validation, secrets handling — the cost of a bug dwarfs the cost of a flagship LLM call. WRITE with a flagship (Opus 5.5 / GPT-6 Sol), REVIEW with 2-3 reasoning-tier models from DIFFERENT vendors (`patchwork-harness review` does exactly this with the security_reviewer role), and never trust an absence claim ('X is missing') that the L4.5 verifier could not ground."

  bulk_coding:
    preferred_tier: workhorse
    preferred_models: [claude-sonnet-5-5, claude-sonnet-5, gpt-6-sol]
    cheap_fallback: [gpt-6-luna, gemini-3.1-flash-lite, claude-haiku-4-5]
    why: "Mass renames, format-conversions, mechanical refactors — speed and cost dominate. Don't pay flagship prices for mechanical edits."

  architectural:
    preferred_tier: flagship
    preferred_models: [claude-opus-5-5, gpt-6-astra, claude-fable-5-1]
    cheap_fallback: []
    why: "System design, large-scale migrations, cross-cutting refactors. Need a flagship-tier model with large context that holds the full picture in mind; promote to the reasoning tier when the decision is hard to reverse."

  debugging:
    preferred_tier: flagship
    preferred_models: [claude-opus-5-5, claude-sonnet-5-5, gemini-3.8-flash, gpt-6-sol]
    cheap_fallback: [claude-sonnet-5]
    why: "Subtle bugs need state-reasoning across many files. Flagship-tier models connect more dots. Add a reasoning-tier model if the bug is logic/algorithmic."

  testing:
    preferred_tier: workhorse
    preferred_models: [claude-sonnet-5-5, claude-sonnet-5, gemini-3.8-flash]
    cheap_fallback: [gpt-6-luna]
    why: "Workhorse writes good tests cheaply for typical paths. Promote to flagship when coverage matters or the SUT has subtle invariants. Reasoning tier for proving correctness."

  algorithms:
    preferred_tier: reasoning
    preferred_models: [o4-mini, gemini-3.1-pro-preview, claude-fable-5-1, gpt-6-astra]
    cheap_fallback: []
    why: "Reasoning-tier model REVIEWS algorithm correctness; pair with a flagship-tier model for the actual implementation. No cheap fallback — wrong algorithms compound cost downstream."

  devops_iac:
    preferred_tier: workhorse
    preferred_models: [claude-sonnet-5-5, claude-sonnet-5, gemini-3.8-flash]
    cheap_fallback: [claude-haiku-4-5]
    why: "Terraform/k8s/CI configs are pattern-heavy and well-served by workhorse. Promote to flagship for novel pipeline architecture."

  data_engineering:
    preferred_tier: flagship
    preferred_models: [claude-opus-5-5, gpt-6-sol, claude-sonnet-5]
    cheap_fallback: [gpt-6-luna]
    why: "ETL design, complex SQL, schema design need flagship judgment. Cheap-fast OK for trivial pipeline glue."

  docs:
    preferred_tier: workhorse
    preferred_models: [claude-sonnet-5-5, claude-sonnet-5, claude-haiku-4-5]
    cheap_fallback: [gpt-6-luna]
    why: "Documentation is mostly synthesis — workhorse has the right voice for READMEs; cheap-fast is fine for inline comments."

  codebase_analysis:
    preferred_tier: reasoning
    preferred_models: [gemini-3.1-pro-preview, claude-opus-5-5, gpt-6-astra]
    cheap_fallback: [gemini-3.8-flash]
    why: "Reading and summarising whole codebases needs huge context + strong reasoning. Every current flagship has a ~1M window; prefer gemini-3.1-pro-preview for reasoning-per-dollar, 3.8 Flash when it must be fast and cheap. Page big files with read's offset/next_offset - never conclude from a truncated read."

  writing:
    preferred_tier: local
    preferred_models: ["gemma3:12b", "mistral-nemo", "qwen3:8b"]
    cheap_fallback: [claude-haiku-4-5]
    why: "Prose, essays, notes, drafts, rewording, summaries of provided text. Local models are free and private — the right default on this laptop, and MANDATORY for personal/sensitive text. gemma3:12b writes best; qwen3:8b when the step must also call tools. Fall back to cloud only when the local provider is not live or the writing needs flagship-level reasoning."

  web_research:
    preferred_tier: research
    preferred_models: [sonar-pro, sonar-reasoning-pro, sonar-deep-research]
    cheap_fallback: [sonar, grok-4.7]
    why: "Finding current/live information with sources. TWO grounded options: (a) Perplexity Sonar (purpose-built — sonar-pro default, sonar-reasoning-pro to synthesise sources, sonar-deep-research for long surveys), or (b) a gemini step with \"grounded\": true (live Google Search + citations, reuses GEMINI_API_KEY). If only the Google key is set (the case on this machine), use grounded gemini. NEVER route a step that must read/write/edit files or run commands here — research steps return cited text only; do the research step, THEN hand findings to a flagship coder."

# Routing heuristics — guidance the planner injects into its decomposition
# prompt. These speak in TIERS, not vendor names, so they stay correct
# when new flagship models ship.
routing_heuristics:
  - "STEP 1: classify the step's domain (frontend/backend/security/bulk_coding/architectural/debugging/testing/algorithms/devops_iac/data_engineering/docs/codebase_analysis/writing/web_research). Then consult domain_routing for that domain's preferred_tier and preferred_models."
  - "PICK BY TIER FIRST. preferred_models is the current shortlist as of corpus_metadata.last_reviewed; if the model registry has a newer flagship-tier coder not in that list, you may pick it instead."
  - "ONLY pick models in the 'Available models' list you were given - it is already filtered to what this key can reach right now. A catalog entry hidden from that list is unreachable this session."
  - "DO NOT be biased toward one vendor. If multiple flagship-tier models are available (Anthropic + OpenAI + Google), prefer the one whose strengths match the specific step. Mix vendors across a plan when each does its own piece best."
  - "Default for 'write code that matters' is ANY flagship-tier coder — never default to a workhorse-tier model unless the step is bulk/mechanical/cheap-fallback."
  - "If the goal mentions 'security', 'auth', 'crypto', 'sanitize', 'CSRF', 'XSS', 'SQL injection', 'review' — WRITE with a flagship, REVIEW with reasoning-tier models from different vendors. NEVER cheap-fallback security work, regardless of budget."
  - "If the goal mentions 'rename', 'format', 'mass', 'across the codebase', 'bulk' — that's bulk_coding; use workhorse or cheap_fast tier."
  - "If the goal mentions React/Vue/Svelte/CSS/component/UI — frontend; use a flagship-tier coder."
  - "Plan with the cheapest reliable model (cheap_fast tier — typically Haiku — for the planner itself); EXECUTE with the right tier for each step."
  - "Mix tiers within a plan — cheap_fast to classify, flagship to write hard code, workhorse for tests, cheap_fast for doc strings."
  - "When budget is tight (<$0.20 total), drop flagships from non-critical steps but KEEP them for security and architectural steps. gemini-3.8-flash is the cheapest flagship-tier coder ($0.75/$3.75)."
  - "For algorithm correctness, ALWAYS pair a reasoning-tier model (review) with a flagship-tier model (implementation)."
  - "For web research / current info / 'what's the latest on X', route a dedicated research step to a research-tier model (Sonar) or a gemini step with grounded: true — never an ungrounded flagship."
  - "Perplexity (sonar*) is RESEARCH-ONLY: it has NO tool calling. Never give it a step that reads/writes/edits files or runs commands."
  - "When a coding step is cost-sensitive or high-throughput but still needs flagship quality, prefer gemini-3.8-flash; reserve Opus 5.5 / Astra for the hardest multi-file changes."
  - "If the goal is writing/drafting prose (essay, notes, blog, letter, summary of provided text) and provider 'local' is live, route it to local tier ($0, private): gemma3:12b for pure text, qwen3:8b when the step must write files. This is MANDATORY for personal/sensitive text."
  - "Code-review steps must READ the code before judging it: budget enough max_tool_turns (8-10) for paged reads and greps, and instruct the step to page big files with read offset/next_offset."

anti_patterns:
  - "Don't route hard reasoning or multi-file coding to local-tier models — they're for writing/drafting and private text, not serious engineering."
  - "Don't default to a workhorse-tier model for serious coding — workhorse is the BULK/CHEAP tier here, not the default."
  - "Don't use cheap_fast tier for production code — its code is correct but uninspired."
  - "Don't use reasoning-tier models for code generation — use them to think about/review code."
  - "Don't use flagship_alt models for tight agent loops — they're alternates and second opinions."
  - "Don't use a flagship-tier model for a task that fits in 4K input tokens AND is mechanical — that's bulk; workhorse/cheap_fast wins."
  - "Don't cheap-fallback security work — wrong trade-off; the cost of a bug dwarfs the cost of any single LLM call."
  - "Don't pick a model whose provider isn't available in this environment (no API key) or that is hidden from the available list — the planner is told which models are live."
  - "Don't be loyal to a vendor. The 'right' flagship today may be a different vendor tomorrow — pick by tier and per-step strengths, not by brand."
  - "Don't let a reviewer report code as missing when its read was truncated or its grep engine failed — 'unknowable' is not 'absent'."
