      - "Bulk mechanical edits, classification, docs (10x+ overkill)"
      - "Latency-sensitive loops - it is the slowest current model"
    quirks:
      - "Adaptive thinking always on; effort defaults to high"
      - "Cache hits are 2.5% of input price - cache the system prompt on long reviews"
      - "Same underlying model as Mythos 5.1, which is org-gated; nothing in a normal code review is dual-use gated, so Fable is the working lane"
    typical_cost_per_step_usd: 0.07

