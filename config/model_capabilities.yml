# Model capabilities — the knowledge corpus the planner uses to route
# work to the right specialist. The orchestrator's value is in DELEGATION:
# the BEST-AVAILABLE model in each tier handles work in its sweet spot,
# regardless of vendor.
#
# IMPORTANT: This file should NOT be biased toward any specific model.
# It's biased toward TIERS:
#   - flagship      — the current best for serious coding (whoever ships it)
#   - workhorse     — fast/cheap-enough for the bulk
#   - cheap_fast    — for coordination, classification, mechanical edits
#   - reasoning     — slow but thorough thinking (algorithm correctness, security)
#   - flagship_alt  — strong alternates for second-opinion / huge context
#   - research      — live web with citations (no tools)
#   - local         — free, private, on this laptop
#
# When a vendor ships a new model that beats the current flagship,
# update this file: bump its `last_reviewed`, re-classify the affected
# tier entries, and refresh `domain_routing.preferred_models`. The
# planner picks BY TIER first; the named lists are just the current
# best-in-tier shortlist. Models the key cannot reach right now are hidden
# from the planner at run time (src/providers/availability.ts), so an entry
# here for an unreleased model is harmless.
#
# Three things happen here:
#   1. corpus_metadata — when this was last reviewed and by whom
#   2. Per-model best_for / avoid_for / quirks / tier (capability profiles)
#   3. domain_routing — maps a coding domain to its preferred TIER + the
#      current best-in-tier models for that domain
#   4. routing_heuristics + anti_patterns — guard-rails for the planner

corpus_metadata:
  last_reviewed: "2026-09-29"     # evidence-based refresh (docs/research/model-probe-2026-09-28.json): Opus 5.5, GPT-6 Sol/Luna and Grok 4.7 added and verified by a real call; opus-4-8 and gpt-5.6-terra dropped as dominated. Prior reviews 2026-09-07, 2026-08-12.
  next_review_due: "2026-12-28"   # 3 months — model landscape moves fast; ALSO re-run scripts/probe_models.mjs whenever gpt-6 / gpt-6-pro / claude-mythos-5-1 are expected to unlock
  review_policy: |
    Refresh this corpus when ANY of these happen:
      - A new flagship-tier model ships from any vendor.
      - An existing model's pricing changes by >20%.
      - You notice routing picks that feel "off" in audit logs.
    On refresh: run scripts/probe_models.mjs (a listing is not proof - only a
    real call is), take prices from the vendor pricing page or write
    `unknown`, bump corpus_metadata.last_reviewed, update the affected model
    entries, and re-shortlist domain_routing.preferred_models.
    Stale corpus = biased routing toward last-reviewed-era models.

