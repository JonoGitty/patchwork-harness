# Model registry. Pricing is USD per million tokens and comes ONLY from the
# vendors' published pricing pages (URL per section); `unknown` where none is
# published - never a guess.
#
# availability:
#   verified   - a real 16-token call on THIS key succeeded on `verified_on`
#                (scripts/probe_models.mjs; a listing alone is not proof)
#   unverified - catalogued from announcements; src/providers/availability.ts
#                probes it at runtime (cached, a 404 costs nothing) and the
#                planner/reviewer route to it the moment the key can reach it,
#                skipping it silently until then. A 404 "does not exist or you
#                do not have access" is ambiguous - unreachable-on-this-key,
#                never "nonexistent".
#
# 2026-10-15 (docs/research/model-probe-2026-10-15.json): + gemini-4-argon
# (Gemini 4 "Argon", on the API since the 8 Oct probe; real call OK; $2/$10
# through 30 Nov 2026, then $4/$20 - the Gemini adapter bills the step; 1M in,
# 32,768 out, thinking). Dropped as superseded by a newer model of the same
# vendor at the same or a lower price: claude-opus-5 (opus-5-5),
# gpt-5.6-sol / gpt-5.5 (gpt-6.1-sol),
# gpt-5.6-luna / gpt-5.4-mini / o4-mini (gpt-6-luna), gpt-5.5-pro / o3-pro
# (gpt-6-astra), gemini-3.7-flash (3.8-flash), grok-4.6 (4.7), and claude-sonnet-5
# (sonnet-5-5: same L5 verdicts at half the cost, see `reviewer`). Dropped as never
# reachable: gpt-6 and gpt-6-pro - 404 on every probe since 3 Sept and never on
# the pricing page; OpenAI ships GPT-6 as astra/sol/luna. The adapters keep
# the old prices as a fallback table, so an explicitly named old id still
# prices correctly. No new Anthropic, OpenAI or xAI model since 8 Oct.
# claude-haiku-4-5 stays as `on_request: true` (the maintainer's call): it runs only when
# someone names it, and the planner and the fallbacks never pick it.
#
# 2026-10-08 (docs/research/model-probe-2026-10-08.json): + claude-haiku-5-5
# (released 7 Oct; $0.10/$0.50 up to a 100k-token prompt, $0.50/$2.50 above,
# priced in the adapter). claude-sonnet-5-5 promoted to verified (credit back)
# and made the bulk executor. Both reject `temperature` (400, probed today).
# Not catalogued: Gemini 4 "Argon" (announced, not on the API or this key),
# grok-build-0.1 (on the key but older than grok-4.7; no xAI pricing quote).
#
# 2026-10-02: + gpt-6.1-sol (docs/research/model-probe-2026-10-02.json). Until
# then it fell through to the `unknown`-priced gpt-6 entry by prefix, so its
# calls were ledgered at $0.
#
# Refreshed 2026-09-28 (evidence: docs/research/model-probe-2026-09-28.json;
# previous refresh 2026-09-07). New since then: claude-opus-5-5, gpt-6-sol,
# gpt-6-luna, grok-4.7. Dropped as strictly dominated: claude-opus-4-8 (Opus 5
# and 5.5 are newer at the same or lower price), gpt-5.6-terra (gpt-6-sol is
# newer and cheaper). The adapters keep their prices as a fallback table.

