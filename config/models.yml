# Roles. One line of WHY each - re-decide when the catalog changes.
defaults:
  planner: gpt-6-luna                # 28 Sept head-to-head (scripts/eval_planner.ts, 6 goals x 2): the Gemini critic approved 9/12 of its drafts vs 1/12 for Haiku; 11/12 routing rules vs 8/12; never picked a hidden model; 27% faster; 10x cheaper
  planner_fallback: claude-haiku-4-5 # used when there is no OpenAI key
  executor: claude-opus-5-5          # 28 Sept: beats Opus 5 on every vendor-reported coding/agent benchmark AND is cheaper ($4/$20 vs $5/$25); 1M ctx, 128k out
  bulk_executor: claude-sonnet-5     # $2/$10, 1M ctx, fast - mechanical and bulk edits
  critic: gemini-3.8-flash           # a DIFFERENT vendor critiques the plan; fast, $0.75/$3.75; falls back to the planner model if Gemini is off
  intent_router: gpt-6-luna          # ADR-0018: asked only when the intent head is unsure; 78.6% on 224 labelled real requests (8/8 right on patchwork-harness goals), ~2 s, ~$0.0002 a call
  # Ordered preference; `patchwork-harness review` fans out to the first REACHABLE model
  # per provider (max 3, different vendors). Unverified ids lead on purpose:
  # they are skipped silently until the key can reach them, then used at once.
  # L5 reviewer (ADR-0016, `patchwork-harness run --review`): first reachable model whose
  # vendor differs from the one that did the work. Reasoning-capable but not
  # flagship-priced: a review reads a diff and a gate result, it writes nothing.
  # Order set by `patchwork-harness eval review starter` on 28 Sept 2026 (12 planted cases,
  # 8 of them bugs that pass the visible tests): gpt-6-sol caught 8/8 bugs with
  # 1 arguable false alarm at $0.014/review; sonnet-5 12/12 at $0.040;
  # gemini-3.1-pro-preview right on all 8 it served but 4/12 calls errored.
  # 2 Oct 2026, same suite, each case reviewed twice: gpt-6.1-sol flagged all
  # 16 bad-case reviews and passed all 8 good-case reviews ($0.011/review);
  # gpt-6-sol flagged all 16 bad but also 2 of the 8 good ($0.013/review). So
  # 6.1 leads; 6-sol is its fallback. Results: ~/.patchwork-harness/evals/*-l5cal.json.
  reviewer:
    - gpt-6.1-sol                    # reviews Anthropic work (the default executor)
    - gpt-6-sol                      # if 6.1 is unreachable
    - claude-sonnet-5                # reviews OpenAI work
    - gemini-3.1-pro-preview         # reviews work that used both
  security_reviewer:
    - gpt-6-pro
    - gpt-6
    - claude-mythos-5-1
    - gpt-6-astra                    # OpenAI's most capable; $10/$50
    - claude-fable-5-1               # Anthropic's deepest reasoner; $10/$50
    - gemini-3.1-pro-preview         # Google's heaviest reasoner; $2/$12
    - claude-opus-5-5                # matches/beats Fable on the vendor's coding benchmarks at 40% of the price - the Anthropic fallback lane
    - gpt-6.1-sol                    # near-Astra at a fifth of the price; the L5 calibration's best (2 Oct)
    - gpt-6-sol
    - grok-4.7
