name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Test (verifier exam in strict mode)
        run: npm test
        env:
          PATCHWORK_HARNESS_VERIFIER_EXAM: strict
          PATCHWORK_HARNESS_AVAILABILITY_PROBE: "off"
